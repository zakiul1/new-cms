deployment:
  tasks:
    - export APPPATH=/home/siatexglobal/laravel-app/
    - export PUBLICPATH=/home/siatexglobal/public_html/
    - export LOG=/home/siatexglobal/deploy.log

    - echo "===== DEPLOY START $(date) =====" >> "$LOG"

    # Find rsync (common locations: /usr/bin/rsync, /usr/local/bin/rsync)
    - export RSYNC="$(command -v rsync)"
    - if [ -z "$RSYNC" ]; then echo "ERROR: rsync not installed or not in PATH" >> "$LOG"; exit 1; fi
    - echo "Using rsync: $RSYNC" >> "$LOG"

    - /bin/mkdir -p "$APPPATH" >> "$LOG" 2>&1
    - /bin/mkdir -p "$PUBLICPATH" >> "$LOG" 2>&1

    # Copy app files (excluding runtime + sensitive)
    - echo "[1] RSYNC APP -> $APPPATH" >> "$LOG"
    - /usr/bin/timeout 600 "$RSYNC" -a --delete \
        --exclude=".git/" \
        --exclude=".env" \
        --exclude="storage/" \
        --exclude="bootstrap/cache/" \
        --exclude="node_modules/" \
        --exclude="vendor/" \
        --exclude="config/filesystems.php" \
        ./ "$APPPATH" >> "$LOG" 2>&1

    # Copy public assets but DO NOT overwrite server index.php/.htaccess
    - echo "[2] RSYNC PUBLIC -> $PUBLICPATH" >> "$LOG"
    - /usr/bin/timeout 600 "$RSYNC" -a --delete \
        --exclude="index.php" \
        --exclude=".htaccess" \
        "$APPPATH/public/" "$PUBLICPATH/" >> "$LOG" 2>&1

    - echo "===== DEPLOY END $(date) =====" >> "$LOG"
