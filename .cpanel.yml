deployment:
  tasks:
    - export APPPATH=/home/siatexglobal/laravel-app/
    - export PUBLICPATH=/home/siatexglobal/public_html/
    - export LOG=/home/siatexglobal/deploy.log

    - /bin/echo "==== DEPLOY START $(date) ====" >> $LOG
    - /bin/mkdir -p $APPPATH >> $LOG 2>&1
    - /bin/mkdir -p $PUBLICPATH >> $LOG 2>&1

    - /bin/rsync -a --delete \
        --exclude=".git/" \
        --exclude=".env" \
        --exclude="storage/" \
        --exclude="bootstrap/cache/" \
        --exclude="node_modules/" \
        --exclude="vendor/" \
        --exclude="config/filesystems.php" \
        ./ $APPPATH >> $LOG 2>&1

    - /bin/rsync -a --delete \
        --exclude="index.php" \
        --exclude=".htaccess" \
        $APPPATH/public/ $PUBLICPATH/ >> $LOG 2>&1

    - /bin/echo "==== DEPLOY END $(date) ====" >> $LOG
