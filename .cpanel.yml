deployment:
  tasks:
    - export APPPATH=/home/siatexglobal/laravel-app/
    - export PUBLICPATH=/home/siatexglobal/public_html/

    - /bin/mkdir -p $APPPATH
    - /bin/mkdir -p $PUBLICPATH

    # Copy everything EXCEPT sensitive/runtime files and your server-specific config
    - /bin/rsync -a --delete \
        --exclude=".git/" \
        --exclude=".env" \
        --exclude="storage/" \
        --exclude="bootstrap/cache/" \
        --exclude="node_modules/" \
        --exclude="vendor/" \
        --exclude="config/filesystems.php" \
        ./ $APPPATH

    # Copy public files to public_html
    # IMPORTANT: do NOT overwrite server existing index.php and .htaccess
    - /bin/rsync -a --delete \
        --exclude="index.php" \
        --exclude=".htaccess" \
        $APPPATH/public/ $PUBLICPATH/

    # IMPORTANT: removed these so deploy never changes them
    # - /bin/cp -f $APPPATH/deploy/index.php $PUBLICPATH/index.php
    # - /bin/cp -f $APPPATH/deploy/.htaccess $PUBLICPATH/.htaccess
